[package]
name = "flunkiebal-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Authoritative server for FlunkieBal online matches: runs every match, keeps rooms, seats and logs."

[dependencies]
flunkiebal-core = { path = "../core" }
glam = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
argon2 = "0.5"

[profile.release]
opt-level = 3
strip = true
