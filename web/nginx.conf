# The page, its glue and the .wasm must always be from the same build: the browser asks every time
# (a 304 when nothing changed, thanks to the ETag), so a rebuild never meets a cached half of the last one.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm application/javascript text/javascript text/css;
    gzip_min_length 1024;

    location / {
        # a websocket is the game server (the game connects to wss://flunkiebal.flunkcie.nl itself), so
        # one address can serve both: point the domain's TLS proxy at this port
        error_page 418 = @game;
        if ($http_upgrade ~* "^websocket$") {
            return 418;
        }
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # looked up when used (Docker's DNS), so the page still comes up while the server is down
    location @game {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $game http://server:8787;
        proxy_pass $game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
