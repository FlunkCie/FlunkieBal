plugins {
    id 'com.android.application'
}

def appBuild = (file("$rootDir/../core/src/proto.rs").text =~ /pub const APP_BUILD: u32 = (\d+);/)[0][1] as int

android {
    namespace 'nl.flunkcie.flunkiebal'
    compileSdk 34

    defaultConfig {
        applicationId 'nl.flunkcie.flunkiebal'
        minSdk 26
        targetSdk 34
        // the build number lives in core/src/proto.rs (APP_BUILD), which the server tells old games about
        versionCode appBuild
        versionName "0.${appBuild}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key the downloadable APK has always had, so it installs over it;
            // a release build isn't debuggable (no JDWP, no debug checks in the runtime)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // the game itself: native libraries from ../build-android.sh
    sourceSets {
        main.jniLibs.srcDirs = ["$buildDir/rustLibs"]
    }
    packagingOptions {
        jniLibs.useLegacyPackaging = false
    }
}

def buildRust = tasks.register('buildRust', Exec) {
    workingDir "$rootDir/.."
    commandLine 'sh', 'build-android.sh', "$buildDir/rustLibs"
}
preBuild.dependsOn buildRust
